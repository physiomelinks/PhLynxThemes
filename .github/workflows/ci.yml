name: Validate themes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # On pull requests dist/ may lag behind; the release workflow rebuilds it on main.
      - run: node scripts/validate.mjs
